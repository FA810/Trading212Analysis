services:
  postgres_db:
    image: postgres:15-alpine
    container_name: t212_postgres
    environment:
      # Use .env file variables to keep credentials secure and out of version control
      POSTGRES_USER: ${DB_USER:-trading_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trading_password}
      POSTGRES_DB: ${DB_NAME:-trading212}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - t212_network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: t212_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@trading.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_password}
    ports:
      - "8080:80"
    depends_on:
      - postgres_db
    networks:
      - t212_network
    restart: unless-stopped

  streamlit_app:
    build: .
    container_name: t212_streamlit
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      # Uses the internal network service name as the host address
      - DB_HOST=postgres_db
      - DB_NAME=${DB_NAME:-trading212}
      - DB_USER=${DB_USER:-trading_user}
      - DB_PASSWORD=${DB_PASSWORD:-trading_password}
    depends_on:
      - postgres_db
    networks:
      - t212_network
    restart: unless-stopped

  # Grafana block is currently disabled. Uncomment sections below to re-enable it.
  # grafana:
  #   image: grafana/grafana-oss:latest
  #   container_name: t212_grafana
  #   ports:
  #     - "3000:3000"
