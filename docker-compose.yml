services:
  postgres_db:
    image: postgres:15-alpine
    container_name: t212_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-trading_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trading_password}
      POSTGRES_DB: ${DB_NAME:-trading212}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 🎯 Mappa il file schema.sql locale nella cartella di inizializzazione nativa di Postgres
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - t212_network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: t212_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@trading.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_password}
    ports:
      - "8080:80"
    depends_on:
      - postgres_db
    networks:
      - t212_network
    restart: unless-stopped

  streamlit_app:
    build: .
    container_name: t212_streamlit
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - DB_HOST=postgres_db
      - DB_NAME=${DB_NAME:-trading212}
      - DB_USER=${DB_USER:-trading_user}
      - DB_PASSWORD=${DB_PASSWORD:-trading_password}
    depends_on:
      - postgres_db
    networks:
      - t212_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  t212_network:
    driver: bridge